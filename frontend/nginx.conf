server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  # Proxy the API to the backend container; buffering is off so SSE progress streams live.
  location /api/ { proxy_pass http://backend:3001; proxy_buffering off; proxy_read_timeout 300s; }
  location / { try_files $uri /index.html; }
}
